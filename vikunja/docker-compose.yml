services:
  vikunja:
    image: vikunja/vikunja:2.7.1
    container_name: vikunja
    ports:
      - 8090:3456
    env_file:
      - .env
    environment:
      VIKUNJA_DATABASE_TYPE: ${VIKUNJA_DATABASE_TYPE}
      VIKUNJA_DATABASE_HOST: ${VIKUNJA_DATABASE_HOST}
      VIKUNJA_DATABASE_DATABASE: ${VIKUNJA_DATABASE_DATABASE}
      VIKUNJA_DATABASE_USER: ${VIKUNJA_DATABASE_USER}
      VIKUNJA_DATABASE_PASSWORD: ${VIKUNJA_DATABASE_PASSWORD}
      VIKUNJA_SERVICE_JWTSECRET: ${VIKUNJA_SERVICE_JWTSECRET}
      VIKUNJA_SERVICE_PUBLICURL: ${VIKUNJA_SERVICE_PUBLICURL}
      VIKUNJA_MAILER_ENABLED: "true"
      VIKUNJA_MAILER_HOST: "${VIKUNJA_MAILER_HOST}"
      VIKUNJA_MAILER_PORT: "${VIKUNJA_MAILER_PORT}"
      VIKUNJA_MAILER_AUTHTYPE: "${VIKUNJA_MAILER_AUTHTYPE}"
      VIKUNJA_MAILER_USERNAME: "${VIKUNJA_MAILER_USERNAME}"
      VIKUNJA_MAILER_PASSWORD: "${VIKUNJA_MAILER_PASSWORD}"
      VIKUNJA_MAILER_FROMEMAIL: "${VIKUNJA_MAILER_FROMEMAIL}"
      VIKUNJA_MAILER_FORCESSL: "true"
      VIKUNJA_AUTH_OPENID_ENABLED: true
      VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_NAME: ${PROVIDER_NAME}
      VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_AUTHURL: ${AUTHURL}
      VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_CLIENTID: ${CLIENTID}
      VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_CLIENTSECRET: ${CLIENTSECRET}
      VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_SCOPE: "openid profile email"
      VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_FORCEUSERINFO: false
    volumes:
      - /opt/stacks-data/vikunja/files:/app/vikunja/files
      - ./config.yml:/etc/vikunja/config.yml
    restart: unless-stopped
