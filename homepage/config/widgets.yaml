---
# For configuration options and examples, please see:
# https://gethomepage.dev/latest/configs/service-widgets
- datetime:
    text_size: xl
    format:
        timeStyle: short
        hourCycle: h23

# - resources:
#     label: System
#     cpu: true
#     memory: true
#     disk: /

- search:
    provider: custom
    url: https://search.schryborg.de/search?q=
    focus: true
    target: _blank
    
# - unifi_console:
#     url: https://192.168.1.1
#     username: homepage
#     password: vT*J82^iehgk4p
    # site: Site Name # optional

- openmeteo:
    label: Rasdorf # optional
    # 50.717089390423894, 9.90297425561126
    latitude: 50.717089390423894
    longitude: 9.90297425561126
    timezone: Europe/Berlin # optional
    units: metric # or imperial
    cache: 5 # Time in minutes to cache API responses, to stay within limits
    format: # optional, Intl.NumberFormat options
      maximumFractionDigits: 1
